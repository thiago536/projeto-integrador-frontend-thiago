<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Meu Treino</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="topo">
    <a href="index.html" class="marca">
      <img src="assets/images/logo.svg" alt="" width="40" height="40">
      Meu Treino
    </a>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="exercicios.html">Exercícios</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="conteudo">
    <section>
      <h1>Contato</h1>
      <p>Fale com seu personal.</p>

      <form action="#" method="post">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="telefone">Telefone (opcional)</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(11) 91234-5678">

        <label for="objetivo">Objetivo</label>
        <select id="objetivo" name="objetivo" required>
          <option value="">Escolha</option>
          <option value="hipertrofia">Ganhar massa</option>
          <option value="emagrecimento">Emagrecer</option>
          <option value="condicionamento">Condicionamento</option>
          <option value="saude">Saúde</option>
        </select>

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

        <button type="submit" class="primario">Enviar</button>
        <button type="reset">Limpar</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <p>Meu Treino · Projeto Integrador de Front-End · 2026</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Meu Treino</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="topo">
    <a href="index.html" class="marca">
      <!-- Logo em SVG inline: uma barra com anilhas. O title deixa o desenho acessível -->
      <svg class="logo" width="40" height="40" viewBox="0 0 40 40" role="img" aria-labelledby="logo-titulo">
        <title id="logo-titulo">Logo do Meu Treino: barra com anilhas</title>
        <rect x="1" y="13" width="5" height="14" rx="1" fill="currentColor"/>
        <rect x="7" y="8" width="6" height="24" rx="1" fill="currentColor"/>
        <rect x="13" y="18" width="14" height="4" fill="currentColor"/>
        <rect x="27" y="8" width="6" height="24" rx="1" fill="currentColor"/>
        <rect x="34" y="13" width="5" height="14" rx="1" fill="currentColor"/>
      </svg>
      Meu Treino
    </a>
    <!-- Botão do menu: só aparece no celular. aria-expanded avisa se o menu está aberto -->
    <button class="botao-menu" type="button" aria-expanded="false" aria-controls="menu-principal">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <rect y="3" width="20" height="2.5" fill="currentColor"/>
        <rect y="9" width="20" height="2.5" fill="currentColor"/>
        <rect y="15" width="20" height="2.5" fill="currentColor"/>
      </svg>
      Menu
    </button>
    <nav class="menu" id="menu-principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="exercicios.html">Exercícios</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main class="conteudo">
    <section class="secao">
      <h1>Fale com o personal</h1>
      <p>Mande sua dúvida ou peça ajustes na sua ficha.</p>

      <form class="formulario" action="#" method="post">
        <p class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" autocomplete="name" required>
        </p>
        <p class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </p>
        <p class="campo">
          <label for="telefone">Telefone (opcional)</label>
          <input type="tel" id="telefone" name="telefone" autocomplete="tel" placeholder="(11) 91234-5678">
        </p>
        <p class="campo">
          <label for="objetivo">Objetivo</label>
          <select id="objetivo" name="objetivo" required>
            <option value="">Escolha uma opção</option>
            <option value="hipertrofia">Ganhar massa muscular</option>
            <option value="emagrecimento">Emagrecer</option>
            <option value="condicionamento">Melhorar o condicionamento</option>
            <option value="saude">Saúde e qualidade de vida</option>
          </select>
        </p>
        <p class="campo">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
        </p>
        <p class="acoes">
          <button class="botao botao-primario" type="submit">Enviar</button>
          <button class="botao botao-secundario" type="reset">Limpar</button>
        </p>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <p>Meu Treino · Projeto Integrador de Front-End · 2026</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Meu Treino</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="topo">
    <a href="index.html" class="marca">
      <img src="img/logo.svg" alt="" width="40" height="40">
      Meu Treino
    </a>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="exercicios.html">Exercícios</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="conteudo">
    <section>
      <h1>Contato</h1>
      <p>Fale com seu personal.</p>

      <form action="#" method="post">
        <label>Nome</label>
        <input type="text" name="nome" required>

        <label>E-mail</label>
        <input type="email" name="email" required>

        <label>Telefone (opcional)</label>
        <input type="tel" name="telefone" placeholder="(11) 91234-5678">

        <label>Objetivo</label>
        <select name="objetivo" required>
          <option value="">Escolha</option>
          <option value="hipertrofia">Ganhar massa</option>
          <option value="emagrecimento">Emagrecer</option>
          <option value="condicionamento">Condicionamento</option>
          <option value="saude">Saúde</option>
        </select>

        <label>Mensagem</label>
        <textarea name="mensagem" rows="5" required></textarea>

        <button type="submit" class="primario">Enviar</button>
        <button type="reset">Limpar</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <p>Meu Treino · Projeto Integrador de Front-End · 2026</p>
  </footer>
</body>
</html>

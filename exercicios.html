<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios | Meu Treino</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="topo">
    <a href="index.html" class="marca">
      <svg class="logo" width="40" height="40" viewBox="0 0 40 40" role="img" aria-labelledby="logo-titulo">
        <title id="logo-titulo">Logotipo Meu Treino</title>
        <rect width="40" height="40" rx="6" fill="#1d1d1b"/><rect x="3" y="14" width="4" height="12" rx="1" fill="#f3efe6"/><rect x="8" y="10" width="5" height="20" rx="1" fill="#f3efe6"/><rect x="13" y="18.5" width="14" height="3" fill="#b83a12"/><rect x="27" y="10" width="5" height="20" rx="1" fill="#f3efe6"/><rect x="33" y="14" width="4" height="12" rx="1" fill="#f3efe6"/>
      </svg>
      Meu Treino
    </a>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="exercicios.html">Exercícios</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="conteudo">
    <section>
      <h1>Exercícios</h1>
      <p>Os mais usados nas fichas.</p>
      <div id="lista-exercicios" class="row g-4"></div>
    </section>

    <section>
      <h2>Novo exercício</h2>
      <p>Salva só neste navegador.</p>
      <form id="form-exercicio">
        <label for="novo-nome">Nome</label>
        <input type="text" id="novo-nome" name="nome" maxlength="40" required>

        <label for="novo-grupo">Grupo</label>
        <select id="novo-grupo" name="grupo">
          <option value="Pernas">Pernas</option>
          <option value="Peito">Peito</option>
          <option value="Costas">Costas</option>
          <option value="Ombros">Ombros</option>
          <option value="Braços">Braços</option>
          <option value="Outro">Outro</option>
        </select>

        <label for="nova-descricao">Descrição (opcional)</label>
        <input type="text" id="nova-descricao" name="descricao" maxlength="80">

        <button type="submit" class="primario">Adicionar</button>
        <p id="aviso"></p>
      </form>
    </section>
  </main>

  <!-- Modal do Bootstrap: o JavaScript preenche com os dados do exercício clicado -->
  <div class="modal fade" id="modal-exercicio" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="modal-titulo">Exercício</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="grupo" id="modal-grupo"></p>
          <p id="modal-descricao"></p>
          <h3>Como executar</h3>
          <p id="modal-execucao"></p>
        </div>
        <div class="modal-footer">
          <button type="button" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="rodape">
    <p>Meu Treino · Projeto Integrador de Front-End · 2026</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios | Meu Treino</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="topo">
    <a href="index.html" class="marca">
      <!-- Logo em SVG inline: uma barra com anilhas. O title deixa o desenho acessível -->
      <svg class="logo" width="40" height="40" viewBox="0 0 40 40" role="img" aria-labelledby="logo-titulo">
        <title id="logo-titulo">Logo do Meu Treino: barra com anilhas</title>
        <rect x="1" y="13" width="5" height="14" rx="1" fill="currentColor"/>
        <rect x="7" y="8" width="6" height="24" rx="1" fill="currentColor"/>
        <rect x="13" y="18" width="14" height="4" fill="currentColor"/>
        <rect x="27" y="8" width="6" height="24" rx="1" fill="currentColor"/>
        <rect x="34" y="13" width="5" height="14" rx="1" fill="currentColor"/>
      </svg>
      Meu Treino
    </a>
    <!-- Botão do menu: só aparece no celular. aria-expanded avisa se o menu está aberto -->
    <button class="botao-menu" type="button" aria-expanded="false" aria-controls="menu-principal">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <rect y="3" width="20" height="2.5" fill="currentColor"/>
        <rect y="9" width="20" height="2.5" fill="currentColor"/>
        <rect y="15" width="20" height="2.5" fill="currentColor"/>
      </svg>
      Menu
    </button>
    <nav class="menu" id="menu-principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="exercicios.html">Exercícios</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main class="conteudo">
    <section class="secao">
      <h1>Exercícios</h1>
      <p>Catálogo com os exercícios que mais aparecem nas fichas.</p>
      <!-- A lista é montada pelo JavaScript a partir de um array (js/script.js) -->
      <ul class="grade-exercicios" id="lista-exercicios"></ul>
    </section>
  </main>

  <footer class="rodape">
    <p>Meu Treino · Projeto Integrador de Front-End · 2026</p>
  </footer>
</body>
</html>

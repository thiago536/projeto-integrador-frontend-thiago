<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios | Meu Treino</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="topo">
    <a href="index.html" class="marca">
      <img src="img/logo.svg" alt="" width="40" height="40">
      Meu Treino
    </a>
    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="exercicios.html">Exercícios</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="conteudo">
    <section>
      <h1>Exercícios</h1>
      <p>Os mais usados nas fichas.</p>
      <div id="lista-exercicios" class="grade"></div>
    </section>

    <section>
      <h2>Novo exercício</h2>
      <p>Salva só neste navegador.</p>
      <form id="form-exercicio">
        <label>Nome</label>
        <input type="text" name="nome" maxlength="40" required>

        <label>Grupo</label>
        <select name="grupo">
          <option value="Pernas">Pernas</option>
          <option value="Peito">Peito</option>
          <option value="Costas">Costas</option>
          <option value="Ombros">Ombros</option>
          <option value="Braços">Braços</option>
          <option value="Outro">Outro</option>
        </select>

        <label>Descrição (opcional)</label>
        <input type="text" name="descricao" maxlength="80">

        <button type="submit" class="primario">Adicionar</button>
        <p id="aviso"></p>
      </form>
    </section>
  </main>

  <footer class="rodape">
    <p>Meu Treino · Projeto Integrador de Front-End · 2026</p>
  </footer>
</body>
</html>
